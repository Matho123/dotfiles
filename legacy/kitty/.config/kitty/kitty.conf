#Font
font_family family="Iosevka Term" style="Regular"
italic_font auto
bold_font Iosevka Term Bold 
bold_italic_font Iosevka Term Bold Italic
font_size 18
disable_ligatures cursor
modify_font cell_width 100%
modify_font cell_height 100%
# text_composition_strategy legacy

# Theme
cursor #6287b5
cursor_text_color #000000
cursor_shape beam
foreground #bbbbbb
background #000000
url_color #d65c9d

# Misc
cursor_shape block
# cursor_blink_interval 0.5
# cursor_trail 1
# cursor_trail_decay 0 0.05
shell_integration no-cursor

background_opacity 0.9
hide_window_decorations yes
enable_audio_bell no

map ctrl+shift+j change_font_size all +1.0
map ctrl+shift+k change_font_size all -1.0
map ctrl+shift+ö restore_font_size
