#Font
font_family family="JetBrains Mono" style=ExtraLight
italic_font auto
bold_font auto
bold_italic_font auto
font_size 13
disable_ligatures cursor
modify_font cell_width 95%
# text_composition_strategy legacy

# Theme
cursor #bbbbbb
foreground #bbbbbb
background #000000
url_color #d65c9d

# normal
color0 #000000
color1 #5f8787
color2 #9b8d7f
color3 #8c7f70
color4 #bbbbbb
color5 #999999
color6 #aaaaaa
color7 #c1c1c1

# bright
color8 #333333
color9 #aaaaaa
color10 #121212
color11 #222222
color12 #999999
color13 #999999
color14 #444444
color15 #c1c1c1

# Misc
cursor_text_color background
cursor_shape block
# cursor_blink_interval 0.5
# cursor_trail 1
# cursor_trail_decay 0 0.05
shell_integration no-cursor

background_opacity 0.9
hide_window_decorations yes
enable_audio_bell no

map ctrl+shift+j increase_font_size
map ctrl+shift+k decrease_font_size
map ctrl+shift+ö restore_font_size
