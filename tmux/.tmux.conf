# color setup

set -g default-terminal "alacritty"
set -ga terminal-overrides ',*:RGB'

# undercurl support
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
# support colors for undercurl
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

set -g mouse on

# status bar style
set-option -g status-position top
set -g status-style 'fg=#a0a0a0 bg=#1a1a1a' #| purple fg=#9752b3 bg=#1c0f21

set -g status-left-length 45
set -g status-left "#S"

set -g status-justify absolute-centre
setw -g window-status-current-format '#I:#W'
setw -g window-status-current-style 'fg=#b3a084 '

setw -g window-status-format '#I:#W'
setw -g window-status-style 'fg=#757575'

set -g status-right-length 200
set -g status-right "%H:%M"
set -g status-right-style ''

# pane style
set -g pane-border-style 'fg=#CCCCCC'
set -g pane-active-border-style 'fg=#ff880a'

# windows
set -g base-index 1
set -g renumber-windows on

# get rid of vim lag'
set -s escape-time 0

# redraw statusline every 5 seconds
set -g status-interval 5

# === Key bindings ===
set -g prefix C-s
bind r source-file ~/.tmux.conf

# vim motions for selecting panes 
bind h select-pane -L
bind l select-pane -R
bind k select-pane -U
bind j select-pane -D

# vim motions for managing windows
bind c new-window -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind o split-window -v -c "#{pane_current_path}"
bind-key -n M-0 select-window -t 0
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9

# misc
unbind -n Tab
setw -g mode-keys vi
bind-key -T root M-i copy-mode
bind-key -n C-f run-shell "tmux neww bash ~/.scripts/tmux_session.sh"
set-option -g default-shell /usr/bin/zsh
